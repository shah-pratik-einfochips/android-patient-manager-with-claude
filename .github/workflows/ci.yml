name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PatientHealth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDevDebugUnitTest assembleDevDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: PatientHealth/app/build/reports/tests

  instrumented:
    name: Instrumented UI tests (emulator)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PatientHealth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: PatientHealth
          script: ./gradlew connectedDevDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidTest-reports
          path: PatientHealth/app/build/reports/androidTests
